<div class="card">
  <div class="card-header">
    <!-- Custom Checkboxes Color -->
    <div class="form-check mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        id="allPermission"
        [(ngModel)]="grantAllPermissions"
        (onChange)="changeGrantAllPermissions()"
      />
      <label class="form-check-label" for="allPermission"> Tüm izinleri ver </label>
    </div>

  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-md-3">
        <ul ngbNav #verticalNav="ngbNav" [activeId]="1" class="nav flex-column nav-pills text-center">
          <li *ngFor="let x of groups; let i = index" [ngbNavItem]="i+1">
              <a ngbNavLink class="mb-2"  (click)="changeDisplays(x.name)">
                  <span class="d-sm-block">{{ x.displayName }}</span>
              </a>
              <ng-template ngbNavContent>
                <div class="card" style="padding: 4%">

                  <div class="form-check mb-3">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="selectAll"
                      [(ngModel)]="selectAllPermissions"
                        (onChange)="changeSelectAllPermissions()"
                    />
                    <label class="form-check-label" for="selectAll"> Hepsini seç </label>
                  </div>
                
                  <div class="row" style="padding-left: 10px;">
                    <div class="col-md-12 field-checkbox" *ngFor="let p of selectedPermissions">
                      <div class="form-check mb-3">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          id="selectAll"
                          [(ngModel)]="p.isGranted"
                          [disabled]="p.isDisabled"
                          inputId="{{ p.name }}"
                          (onChange)="changeChilds(p)"
                        />
                        <label class="form-check-label" for="{{ p.name }}">{{ p.displayName }} </label>
                      </div>

                    </div>
                  </div>
                </div>
              </ng-template>
          </li>
