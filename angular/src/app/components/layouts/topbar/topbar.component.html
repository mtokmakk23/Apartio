<header id="page-topbar" data-scroll-header (window:scroll)="windowScroll()">
  <div class="layout-width">
    <div class="navbar-header">
      <div class="d-flex">
        <!-- LOGO -->
        <div class="navbar-brand-box horizontal-logo">
          <a href="javascript:void(0);" class="logo logo-dark">
            <span class="logo-sm">
              <img src="assets/images/logo-sm.png" alt="" height="22" />
            </span>
            <span class="logo-lg">
              <img src="assets/images/logo-dark.png" alt="" height="50" />
            </span>
          </a>

          <a href="javascript:void(0);" class="logo logo-light">
            <span class="logo-sm">
              <img src="assets/images/logo-sm.png" alt="" height="22" />
            </span>
            <span class="logo-lg">
              <img src="assets/images/logo-light.png" alt="" height="50" />
            </span>
          </a>
        </div>

        <button
          type="button"
          class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger material-shadow-none"
          id="topnav-hamburger-icon"
          (click)="toggleMobileMenu($event)"
        >
          <span class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        
      </div>
<div class="d-flex">
        <div class="header-item d-flex align-items-center">
          <div class="dropdown" [class.show]="siteDropdownAcik" (click)="toggleSiteDropdown($event)">
            <button
              type="button"
              class="btn btn-soft-primary d-flex align-items-center site-selector-btn"
            >
              <i class="ri-building-2-line fs-18 me-1"></i>
              <span class="d-none d-md-inline-block fw-medium">
                {{ seciliSite?.name || 'Site Seçiniz' }}
              </span>
              <i class="ri-arrow-down-s-line ms-1"></i>
            </button>
            <div class="dropdown-menu dropdown-menu-end site-dropdown-menu" [class.show]="siteDropdownAcik">
              <div class="px-3 pt-2 pb-1">
                <div class="form-icon right">
                  <input
                    type="text"
                    class="form-control form-control-sm form-control-icon"
                    placeholder="Site ara..."
                    [(ngModel)]="siteArama"
                    (click)="$event.stopPropagation()"
                  />
                  <i class="ri-search-line"></i>
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <h6 class="dropdown-header">Siteler</h6>
              <a
                *ngFor="let site of filteredSiteler"
                href="javascript:void(0);"
                class="dropdown-item d-flex align-items-center"
                [class.active]="site.id === seciliSite?.id"
                (click)="siteSec(site)"
              >
                <i class="ri-building-2-line me-2"></i>
                <span class="flex-grow-1">{{ site.name }}</span>
                <i class="ri-check-line text-success" *ngIf="site.id === seciliSite?.id"></i>
              </a>
              <div *ngIf="!siteYukleniyor && filteredSiteler.length === 0" class="dropdown-item-text text-muted text-center py-2">
                Site bulunamadı
              </div>
              <div *ngIf="siteYukleniyor" class="dropdown-item-text text-muted text-center py-2">
                Yükleniyor...
              </div>
            </div>
          </div>
        </div>
</div>
      <div class="d-flex align-items-center">
        

        <div class="ms-1 header-item d-none d-sm-flex">
          <button
            type="button"
            class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
            data-toggle="fullscreen"
            (click)="fullscreen()"
          >
            <i class="bx bx-fullscreen fs-22"></i>
          </button>
        </div>

        <div class="ms-1 header-item d-none d-sm-flex">
          <button
            type="button"
            class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle light-dark-mode"
          >
            <i class="bx bx-moon fs-22" (click)="changeMode('dark')"></i>
            <i class="bx bx-sun fs-22" (click)="changeMode('light')"></i>
          </button>
        </div>
       
        <div class="dropdown ms-sm-3 header-item topbar-user" ngbDropdown>
          <button
            type="button"
            class="btn material-shadow-none"
            id="page-header-user-dropdown"
            data-bs-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="false"
            ngbDropdownToggle
          >
            <span class="d-flex align-items-center">
              <img
                class="rounded-circle header-profile-user"
                src="assets/images/users/avatar-1.jpg"
                alt="Header Avatar"
              />
              <span class="text-start ms-xl-2">
                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text"
                  >{{ currentUser.name }} {{ currentUser.surName }}</span
                >
                <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text">{{
                  currentUser.roles[0]
                }}</span>
              </span>
            </span>
          </button>
          <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
            <h6 class="dropdown-header">Merhaba {{ currentUser.name }}</h6>

       

            <!-- <a class="dropdown-item" routerLink="/account/manage"
              ><i class="mdi mdi-cog-outline text-muted fs-16 align-middle me-1"></i>
              <span class="align-middle">Ayarlar</span></a
            > -->
            <a class="dropdown-item" href="javascript: void(0);" (click)="logout()"
              ><i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
              <span class="align-middle" data-key="t-logout">Çıkış Yap</span></a
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
